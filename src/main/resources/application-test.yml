spring:
  main:
    banner-mode: off
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration
logging:
  level:
    root: WARN
    org.maria.compliance: INFO

compliance:
  pdf:
    section-detection:
      enabled: true
      heading-patterns: '^[ \t]*(?![0-9]+\.[ \t]+(?:Januar|January|Februar|February|März|March|April|Mai|May|Juni|June|Juli|July|August|September|Oktober|October|November|Dezember|December)\b)(?:(?:[IVX]+|[0-9]+)\.(?:[0-9]+(?:\.[0-9]+)*\.?)?[ \t]+\p{Lu}|§[ \t]*[0-9]+)'
  rag:
    chunk-size: 1000
    chunk-overlap: 200