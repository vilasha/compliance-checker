spring:
  main:
    banner-mode: off
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration
logging:
  level:
    root: WARN
    org.maria.compliance: INFO

compliance:
  ollama:
    chat-model: llama3.1:8b
  pdf:
    section-detection:
      enabled: true
      heading-patterns: "^(Art\\.|§|Article|Section|Chapter|Artikel)"
  rag:
    chunk-size: 1000
    chunk-overlap: 200
    top-k-results: 5
    similarity-threshold: 0.7
    parse-retry-max: 4
