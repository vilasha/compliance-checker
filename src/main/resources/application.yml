spring:
  application:
    name: compliance-checker

  # Thymeleaf Configuration
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML

  # File Upload Configuration
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
      file-size-threshold: 2KB

  # Security (Basic for local, will be Azure AD for cloud)
  security:
    user:
      name: admin
      password: admin123

  # Caching Configuration
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterWrite=1h
    cache-names:
      - regulatory-metadata
      - law-names
      - query-variants

# Server Configuration
server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,application/javascript,application/json

# Logging Configuration
logging:
  level:
    root: WARN
    org.maria.compliance: INFO
    org.springframework.web: WARN
    org.springframework.security: WARN
    org.springframework.jdbc.core: WARN
    dev.langchain4j: INFO
    # PDFBox (font metrics, space widths)
    org.apache.pdfbox: WARN
    org.apache.fontbox: WARN
    # HikariCP (pool stats, connection lifecycle)
    com.zaxxer.hikari: WARN
    # PostgreSQL driver (TLS handshakes, certs)
    org.postgresql: WARN
    # Java SSL/TLS certificate logging
    jdk.event.security: OFF
    javax.net.ssl: WARN
    sun.security.ssl: WARN
    # Flyway
    org.flywaydb: INFO
    # Spring internals (bean creation, autowiring)
    org.springframework.beans: WARN
    org.springframework.context: WARN
    org.springframework.boot: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: ./logs/application.log
    max-size: 10MB
    max-history: 30

# Custom Application Configuration
compliance:
  # Ollama Configuration
  ollama:
    base-url: http://localhost:11434
    chat-model: qwen2.5:3b
    embedding-model: bge-m3
    # Per-request timeout. qwen2.5:3b on CPU with a substantial prompt (system
    # instructions + retrieved chunks + policy section text) routinely takes
    # 60–180 s per call. 5 minutes gives realistic headroom; failures still
    # surface in reasonable time. If running on GPU, this can be tightened
    timeout: 30m
    max-retries: 3
    # Context window passed to Ollama (options.num_ctx). Ollama's default is 4096
    # tokens and it truncates silently — with retrieved chunks + policy section +
    # rules + schema in one prompt, parts of the prompt simply vanished. 16k fits
    # the full prompt with headroom; raise toward 32k on GPU if needed
    num-ctx: 16384

  # Embedding Store (PgVectorEmbeddingStore via LangChain4j)
  embedding-store:
    table: regulatory_embeddings
    dimension: 1024
    index-list-size: 100

  # RAG Configuration with Multi-Query Enhancement
  rag:
    chunk-size: 1024
    chunk-overlap: 256
    top-k-results: 5
    similarity-threshold: 0.7
    # Hard cap on analysis units per upload (bounds total runtime)
    max-policy-sections: 50
    # Sections longer than this are split into overlapping parts before analysis.
    # Protects the embedding query (bge-m3 truncates past 8k tokens) and the chat
    # prompt budget when heading detection falls back to "Full Document"
    max-section-chars: 6000
    # Single-query RAG: max retries on JSON parse failure.
    # Total LLM calls per analysis = 1 + parse-retry-max.
    parse-retry-max: 4

    # Multi-Query Retrieval with Perspective Synthesis
    multi-query:
      enabled: true
      query-variants: 5  # Number of different perspectives to generate
      perspectives:
        - name: strict_legal
          description: "Literal interpretation focusing on exact regulatory language"
          weight: 1.5
        - name: industry_standard
          description: "How the regulation is typically understood in practice"
          weight: 1.2
        - name: edge_cases
          description: "Boundary conditions and special circumstances"
          weight: 1.0
        - name: cross_regulatory
          description: "Related regulations from other frameworks (FINMA, Solvency UK)"
          weight: 1.1
        - name: risk_based
          description: "Focus on underlying risk principles"
          weight: 1.3

      aggregation:
        deduplication-threshold: 0.9  # Cosine similarity threshold for deduplication
        max-chunks-per-variant: 5     # Max regulatory chunks per query variant
        total-max-chunks: 15           # Max total chunks after aggregation
        parallel-retrieval: true       # Execute variant retrievals in parallel

      # Query generation prompt template
      query-generation-prompt: |
        Given this policy text, generate {count} different analytical queries from these perspectives:
        {perspectives}
        
        Policy text: {policyText}
        
        Return only the queries as a JSON array with format:
        [
          {"perspective": "strict_legal", "query": "..."},
          {"perspective": "industry_standard", "query": "..."}
        ]

  # PDF Processing
  pdf:
    max-file-size-mb: 10
    allowed-mime-types: application/pdf
    section-detection:
      enabled: true
      # Heading detection patterns (regulatory documents). The pattern recognizes three
      # heading styles:
      #   1. Roman numerals (I, II, III, ..., XXXIX) or numeric markers, optionally with
      #      sub-numbering (e.g., "III.3.1"), followed by a required uppercase letter.
      #      Catches FINMA and most German/Swiss regulatory docs.
      #   2. "§ N" paragraph markers — common in German law.
      #   3. "Article N" / "Chapter N" followed by a required Title-case word. Catches
      #      Solvency II / EU directive headings without re-introducing the inline-
      #      reference bug from ADR-006: inline refs are followed by lowercase
      #      prepositions ("of", "to"...), parentheses, or punctuation — none of which
      #      satisfy \p{Lu}\p{Ll}+ (uppercase letter followed by lowercase letters).
      # The negative lookahead excludes calendar dates ("1. Januar...", "30. April...")
      # that PDF text wrap can place at line starts
      # See ADR-006 (original iteration) and ADR-007 (Solvency II re-addition)
      heading-patterns: '^[ \t]*(?![0-9]+\.[ \t]+(?:Januar|January|Februar|February|März|March|April|Mai|May|Juni|June|Juli|July|August|September|Oktober|October|November|Dezember|December)\b)(?:(?:[IVX]+|[0-9]+)\.(?:[0-9]+(?:\.[0-9]+)*\.?)?[ \t]+\p{Lu}|§[ \t]*[0-9]+|(?:Article|Chapter)[ \t]+(?:[IVXLCDM]+|[0-9]+(?:[a-z]+)?)[ \t]+\p{Lu}\p{Ll}+)'

  # Audit Logging
  audit:
    enabled: true
    destination: file  # Options: file, azure-blob
    local-path: ./logs/audit
    log-format: json

  # Regulatory Data Sources
  regulatory:
    data-path: ./data/regulatory
    languages:
      - de
      - fr
      - it
      - en
    sources:
      - name: FINMA
        enabled: true
      - name: Solvency II
        enabled: true
      - name: Solvency UK
        enabled: true
    # Hosts the URL-ingestion endpoint may fetch from (subdomains included).
    # The server downloads these URLs itself, so an open endpoint would let an
    # authenticated user probe internal addresses through it (SSRF).
    # Comma-separated on purpose: @Value List<String> injection splits on commas
    # but cannot bind a YAML list
    allowed-ingest-hosts: finma.ch,fedlex.admin.ch,eur-lex.europa.eu,eiopa.europa.eu,bankofengland.co.uk,legislation.gov.uk

  # FINMA Scraper (activated with --spring.profiles.active=dev,scrape)
  # GUIDs are Sitecore item IDs for document type categories
  # Stable unless FINMA restructures their CMS. To verify or find new GUIDs:
  # DevTools → Network → XHR → select a filter → check --data-raw for the Dokumentenart value
  scraper:
    finma:
      url: https://www.finma.ch/de/dokumente/
      api: https://www.finma.ch/api/search/getresult
      language: de
      page-size: 10
      max-pages: 50
      guid:
        datasource: "{E02680B6-2600-4C66-BD5B-57BF955A97A8}"
        wegleitung: "{56463C7B-3281-4E93-B515-EC580594A196}"
        aufsichtsmitteilung: "{1C2D29B9-E600-4344-9170-786463D19135}"

  # Processing Configuration
  processing:
    async: true
    thread-pool-size: 5
    queue-capacity: 100
    # SSE connection timeout. Must cover the longest possible analysis on the slowest
    # supported hardware: N sections × (ollama.timeout × (1 + ollama.max-retries)) in
    # the worst case. 1 hour covers a ~12-section analysis with the current 30 min
    # per-call timeout. EventSource auto-reconnects on timeout and the StatusController
    # replays history from the in-memory bus, so the practical impact of a too-short
    # value is wasted reconnects, not lost data
    sse-timeout: 1h
    # How long completed-task event history (incl. full reports) stays in memory.
    # After eviction, StatusController serves the result from user_uploads instead
    event-history-retention: 1h

  # Security Configuration (Local)
  security:
    auth-type: basic  # Options: basic, azure-ad
    allowed-origins: http://localhost:8080

# Management Endpoints (Actuator)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
  prometheus:
    metrics:
      export:
        enabled: true